services:
  php:
    build:
      context: ./docker/php
    container_name: hotels_php
    user: "1000:1000"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      COMPOSER_MEMORY_LIMIT: -1
      HOME: /home/app
      COMPOSER_HOME: /home/app/.composer
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - hotels

  nginx:
    image: nginx:alpine
    container_name: hotels_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    networks:
      - hotels

  mysql:
    image: mysql:8.0
    container_name: hotels_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: hotels
      MYSQL_USER: hotels
      MYSQL_PASSWORD: hotels_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hotels

  node:
    image: node:22-alpine
    container_name: hotels_node
    user: "1000:1000"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: ["npm", "run", "dev"]
    ports:
      - "5173:5173"
    networks:
      - hotels

networks:
  hotels:
    driver: bridge

volumes:
  mysql_data:
